<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Xam Reader Pro</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <style>
    :root[data-theme="dark"] {
      --bg: #0f1115;
      --surface: #181b22;
      --surface-hover: #222630;
      --border: #2a2f3d;
      --text: #e4e6eb;
      --text-muted: #8b92a5;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --op-badge: #f59e0b;
    }
    :root[data-theme="sepia"] {
      --bg: #f4ecd8;
      --surface: #fdf6e3;
      --surface-hover: #eee8d5;
      --border: #dcd3bc;
      --text: #433422;
      --text-muted: #7c6f5a;
      --accent: #b58900;
      --accent-soft: rgba(181, 137, 0, 0.15);
      --op-badge: #cb4b16;
    }
    :root[data-theme="light"] {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-hover: #f9fafb;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --op-badge: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--font-size, 16px);
      line-height: 1.6;
    }

    /* Header & Thanh Forum ngang */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      max-width: 960px;
      margin: 0 auto;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .actions { display: flex; gap: 8px; }
    button, .btn {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    button:hover, button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Thanh cuộn chọn Forum nhanh */
    .forum-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px;
      max-width: 960px;
      margin: 0 auto;
      scrollbar-width: none;
      border-top: 1px solid var(--border);
    }
    .forum-bar::-webkit-scrollbar { display: none; }
    .forum-pill {
      white-space: nowrap;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }
    .forum-pill.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Container chính */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Danh sách thớt */
    .thread-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
    }
    .thread-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .thread-item:hover { background: var(--surface-hover); }
    .thread-title {
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .prefix-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .resume-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }
    .thread-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Giao diện đọc bài (Post) */
    .reader-StickyBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .post-author { font-weight: 700; color: var(--text); }
    .op-tag {
      background: var(--op-badge);
      color: #000;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .post-body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 8px 0;
      cursor: zoom-in;
    }
    .post-body blockquote {
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-size: 0.92em;
      color: var(--text-muted);
    }

    /* Lưới xem ảnh nhanh */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .media-grid img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    /* Modal / Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
    }
    .forum-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .forum-card {
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .forum-card:hover { border-color: var(--accent); }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand" onclick="loadForum(state.currentForumPath)">
      <span>⚡ XamReader Pro</span>
    </div>
    <div class="actions">
      <button onclick="openForumsModal()" title="Danh sách tất cả Forums">📂 Chuyên mục</button>
      <button onclick="toggleBookmarksView()" id="btnBookmarks">🔖 Đã lưu</button>
      <button onclick="openSettingsModal()">⚙️ Cài đặt</button>
    </div>
  </div>
  <!-- Thanh cuộn ngang các Forum ghim -->
  <div class="forum-bar" id="pinnedForumsBar"></div>
</header>

<main id="appMain">
  <!-- Nội dung động render tại đây -->
</main>

<!-- Modal Chọn Danh Mục Forums -->
<div class="modal-backdrop" id="forumsModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3>📂 Duyệt theo từng Forum (Box)</h3>
      <button onclick="scanForumsFromHome()">🔄 Quét tự động từ Trang chủ</button>
    </div>
    <p style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">
      Chọn chuyên mục để xem hoặc bấm biểu tượng 📌 để ghim lên thanh ngang.
    </p>
    <div class="forum-grid" id="allForumsList"></div>
  </div>
</div>

<!-- Modal Cài Đặt & Tối Ưu -->
<div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal-content">
    <h3>⚙️ Tùy chỉnh & Tối ưu</h3>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:12px;">
      <label>
        Giao diện (Theme):
        <select id="themeSelect" onchange="updateSetting('theme', this.value)" class="search-input" style="margin-top:4px;">
          <option value="dark">Dark (Tối OLED)</option>
          <option value="sepia">Sepia (Vàng dịu mắt)</option>
          <option value="light">Light (Sáng)</option>
        </select>
      </label>
      <label>
        Cỡ chữ đọc bài:
        <input type="range" min="14" max="22" id="fontSizeRange" oninput="updateSetting('fontSize', this.value)" style="width:100%;" />
      </label>
      <label>
        Tên miền nguồn (Dynamic Domain):
        <input type="text" id="domainInput" placeholder="Ví dụ: https://xamvn.com" class="search-input" style="width:100%;margin-top:4px;" />
      </label>
      <label>
        Ẩn thớt chứa từ khóa (cách nhau bởi dấu phẩy):
        <input type="text" id="muteInput" placeholder="Ví dụ: quảng cáo, tuyển dụng, cờ bạc" class="search-input" style="width:100%;margin-top:4px;" />
      </label>
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="infiniteScrollToggle" onchange="updateSetting('infiniteScroll', this.checked)" />
        Tự động tải trang tiếp theo khi cuộn xuống cuối thớt (Infinite Scroll)
      </label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
        <button onclick="saveSettings()">Lưu cài đặt</button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox xem ảnh -->
<div class="modal-backdrop" id="lightboxModal" onclick="this.classList.remove('open')">
  <img id="lightboxImg" style="max-width:95vw;max-height:92vh;border-radius:8px;" />
</div>

<script>
  // Danh sách Forums mặc định + hỗ trợ tự động quét thêm
  const DEFAULT_FORUMS = [
    { title: '🔥 Có gì mới', path: '/whats-new/posts/', pinned: true },
    { title: '💬 Chuyện trò linh tinh', path: '/r/chuyen-tro-linh-tinh.2/', pinned: true },
    { title: '📰 Điểm báo', path: '/r/diem-bao.35/', pinned: true },
    { title: '❤️ Tư vấn tình cảm', path: '/r/tu-van-tinh-cam.15/', pinned: true },
    { title: '💻 Công nghệ & IT', path: '/r/cong-nghe.18/', pinned: true },
    { title: '📈 Tài chính & Tiền số', path: '/r/tai-chinh-tien-so.42/', pinned: false },
    { title: '⚽ Thể thao', path: '/r/the-thao.28/', pinned: false },
    { title: '📚 Văn học & Truyện', path: '/r/van-hoc.19/', pinned: false }
  ];

  const state = {
    forums: JSON.parse(localStorage.getItem('xr_forums')) || DEFAULT_FORUMS,
    currentForumPath: '/whats-new/posts/',
    threads: [],
    currentThread: null, // { path, title, page, maxPage, opAuthor, posts, allImages }
    opOnlyMode: false,
    galleryMode: false,
    bookmarks: JSON.parse(localStorage.getItem('xr_bookmarks') || '[]'),
    history: JSON.parse(localStorage.getItem('xr_history') || '{}'),
    settings: JSON.parse(localStorage.getItem('xr_settings') || JSON.stringify({
      theme: 'dark',
      fontSize: 16,
      domain: '',
      muteKeywords: '',
      infiniteScroll: false
    }))
  };

  // Áp dụng cài đặt giao diện
  function applySettings() {
    document.documentElement.setAttribute('data-theme', state.settings.theme);
    document.body.style.setProperty('--font-size', state.settings.fontSize + 'px');
  }

  // Hàm gọi API Proxy kèm Dynamic Domain
  async function fetchProxyHtml(path) {
    const headers = {};
    if (state.settings.domain) headers['x-target-domain'] = state.settings.domain;
    const res = await fetch(`/api/proxy?path=${encodeURIComponent(path)}`, { headers });
    if (!res.ok) throw new Error(`Lỗi tải trang (${res.status})`);
    const html = await res.text();
    return new DOMParser().parseFromString(html, 'text/html');
  }

  function proxyImgUrl(rawUrl) {
    if (!rawUrl || rawUrl.startsWith('data:')) return rawUrl;
    const domainParam = state.settings.domain ? `&domain=${encodeURIComponent(state.settings.domain)}` : '';
    return `/api/img?url=${encodeURIComponent(rawUrl)}${domainParam}`;
  }

  // Render thanh Forum ngang
  function renderPinnedForums() {
    const bar = document.getElementById('pinnedForumsBar');
    bar.innerHTML = state.forums
      .filter(f => f.pinned)
      .map(f => `
        <div class="forum-pill ${state.currentForumPath === f.path ? 'active' : ''}"
             onclick="loadForum('${f.path}')">
          ${f.title}
        </div>
      `).join('');
  }

  // Tự động quét toàn bộ danh sách Forums từ trang chủ XenForo
  async function scanForumsFromHome() {
    try {
      const doc = await fetchProxyHtml('/');
      const nodes = doc.querySelectorAll('.node--forum .node-title a, .node-body .node-title a');
      if (!nodes.length) return alert('Không tìm thấy danh sách chuyên mục trên trang chủ.');

      const discovered = [{ title: '🔥 Có gì mới', path: '/whats-new/posts/', pinned: true }];
      const seen = new Set(['/whats-new/posts/']);

      nodes.forEach((a, idx) => {
        const path = a.getAttribute('href');
        const title = a.textContent.trim();
        if (path && title && !seen.has(path)) {
          seen.add(path);
          discovered.push({ title, path, pinned: idx < 6 });
        }
      });

      state.forums = discovered;
      localStorage.setItem('xr_forums', JSON.stringify(state.forums));
      renderPinnedForums();
      renderForumsModalList();
    } catch (e) {
      alert('Lỗi quét danh sách Box: ' + e.message);
    }
  }

  // Tải danh sách thớt của một Forum cụ thể
  async function loadForum(forumPath, page = 1) {
    state.currentForumPath = forumPath;
    state.currentThread = null;
    renderPinnedForums();

    const main = document.getElementById('appMain');
    main.innerHTML = `<div style="padding:20px;text-align:center;">⏳ Đang tải danh sách bài viết...</div>`;

    try {
      let targetPath = forumPath;
      if (page > 1) {
        targetPath = forumPath.replace(/\/$/, '') + `/page-${page}`;
      }

      const doc = await fetchProxyHtml(targetPath);
      const items = doc.querySelectorAll('.structItem--thread');
      const muteList = (state.settings.muteKeywords || '')
        .split(',')
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);

      const threads = [];
      items.forEach(item => {
        const titleLinks = item.querySelectorAll('.structItem-title a');
        if (!titleLinks.length) return;

        let prefix = '';
        let mainLink = titleLinks[0];
        if (titleLinks.length > 1) {
          prefix = titleLinks[0].textContent.trim();
          mainLink = titleLinks[1];
        }

        const title = mainLink.textContent.trim();
        const path = mainLink.getAttribute('href').replace(/\/unread$/, '/');
        const author = item.querySelector('.username')?.textContent.trim() || 'Ẩn danh';
        const time = item.querySelector('time')?.textContent.trim() || '';
        const replies = item.querySelector('.structItem-cell--meta dd')?.textContent.trim() || '0';

        // Kiểm tra từ khóa bị chặn
        if (muteList.some(kw => title.toLowerCase().includes(kw))) return;

        threads.push({ title, prefix, path, author, time, replies });
      });

      state.threads = threads;
      renderThreadList(forumPath, page);
    } catch (e) {
      main.innerHTML = `<div class="post-card">⚠️ Không thể tải chuyên mục: ${e.message}</div>`;
    }
  }

  function renderThreadList(forumPath, page = 1, filterQuery = '') {
    const main = document.getElementById('appMain');
    const filtered = state.threads.filter(t =>
      t.title.toLowerCase().includes(filterQuery.toLowerCase()) ||
      t.author.toLowerCase().includes(filterQuery.toLowerCase())
    );

    main.innerHTML = `
      <div class="thread-toolbar">
        <input type="text" class="search-input" placeholder="🔍 Lọc nhanh tiêu đề hoặc tác giả trong trang..."
               value="${filterQuery}" oninput="renderThreadList('${forumPath}', ${page}, this.value)" />
        <button onclick="loadForum('${forumPath}', ${page})">🔄 Làm mới</button>
      </div>
      <div id="threadContainer">
        ${filtered.map(t => {
          const cleanId = t.path.replace(/page-\d+.*$/, '');
          const savedProgress = state.history[cleanId];
          return `
            <div class="thread-item" onclick="loadThread('${cleanId}', ${savedProgress?.page || 1})">
              <div class="thread-title">
                ${t.prefix ? `<span class="prefix-badge">${t.prefix}</span>` : ''}
                <span>${t.title}</span>
                ${savedProgress ? `<span class="resume-badge">Đọc tiếp trang ${savedProgress.page}</span>` : ''}
              </div>
              <div class="thread-meta">
                <span>👤 ${t.author}</span>
                <span>💬 ${t.replies} phản hồi</span>
                <span>🕒 ${t.time}</span>
              </div>
            </div>
          `;
        }).join('') || '<div class="post-card">Không có bài viết nào phù hợp.</div>'}
      </div>
      <div class="pagination">
        ${page > 1 ? `<button onclick="loadForum('${forumPath}', ${page - 1})">← Trang ${page - 1}</button>` : ''}
        <span>Trang ${page}</span>
        <button onclick="loadForum('${forumPath}', ${page + 1})">Trang ${page + 1} →</button>
      </div>
    `;
  }

  // Tải nội dung chi tiết Thớt
  async function loadThread(threadBasePath, page = 1, append = false) {
    const main = document.getElementById('appMain');
    if (!append) {
      main.innerHTML = `<div style="padding:20px;text-align:center;">⏳ Đang tải bài viết trang ${page}...</div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    try {
      const normalizedBase = threadBasePath.replace(/\/page-\d+.*$/, '').replace(/\/$/, '') + '/';
      const targetPath = page > 1 ? `${normalizedBase}page-${page}` : normalizedBase;
      const doc = await fetchProxyHtml(targetPath);

      const title = doc.querySelector('.p-title-value')?.textContent.trim() || 'Chi tiết chủ đề';
      const pageNavs = Array.from(doc.querySelectorAll('.pageNav-page a')).map(a => parseInt(a.textContent.trim())).filter(Boolean);
      const maxPage = pageNavs.length ? Math.max(...pageNavs) : page;

      const articles = doc.querySelectorAll('article.message--post');
      const posts = [];
      const pageImages = [];

      articles.forEach((art, idx) => {
        const author = art.querySelector('.message-name .username, .message-userDetails .username')?.textContent.trim() || 'Ẩn danh';
        const time = art.querySelector('.message-attribution-main time')?.textContent.trim() || '';
        const postNum = art.querySelector('.message-attribution-opposite li:last-child a')?.textContent.trim() || `#${idx + 1}`;
        const bodyEl = art.querySelector('.message-body .bbWrapper');

        if (!bodyEl) return;

        // Chuyển toàn bộ ảnh qua proxy /api/img và hỗ trợ Lightbox
        bodyEl.querySelectorAll('img').forEach(img => {
          const src = img.getAttribute('data-src') || img.getAttribute('src');
          if (src && !src.includes('smilie') && !src.startsWith('data:')) {
            const proxied = proxyImgUrl(src);
            img.setAttribute('src', proxied);
            img.setAttribute('loading', 'lazy');
            img.setAttribute('onclick', `openLightbox('${proxied}')`);
            pageImages.push(proxied);
          }
        });

        posts.push({ author, time, postNum, html: bodyEl.innerHTML });
      });

      const opAuthor = (page === 1 && posts.length)
        ? posts[0].author
        : (state.currentThread?.opAuthor || posts[0]?.author || '');

      // Lưu lịch sử trang đang đọc
      state.history[normalizedBase] = { title, page, updatedAt: Date.now() };
      localStorage.setItem('xr_history', JSON.stringify(state.history));

      state.currentThread = {
        path: normalizedBase,
        title,
        page,
        maxPage,
        opAuthor,
        posts: append && state.currentThread ? [...state.currentThread.posts, ...posts] : posts,
        allImages: append && state.currentThread ? [...state.currentThread.allImages, ...pageImages] : pageImages
      };

      renderThreadView();
    } catch (e) {
      main.innerHTML = `<div class="post-card">⚠️ Lỗi tải thớt: ${e.message}</div>`;
    }
  }

  function renderThreadView() {
    const t = state.currentThread;
    if (!t) return;

    const isBookmarked = state.bookmarks.some(b => b.path === t.path);
    const visiblePosts = state.opOnlyMode
      ? t.posts.filter(p => p.author === t.opAuthor)
      : t.posts;

    const main = document.getElementById('appMain');
    main.innerHTML = `
      <div class="reader-StickyBar">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <button onclick="loadForum(state.currentForumPath)">← Quay lại Box</button>
          <button class="${state.opOnlyMode ? 'active' : ''}" onclick="toggleOpOnly()">
            👑 Chỉ xem Chủ thớt (${t.opAuthor})
          </button>
          <button class="${state.galleryMode ? 'active' : ''}" onclick="toggleGalleryMode()">
            🖼️ Ảnh (${t.allImages.length})
          </button>
          <button class="${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${t.path}')">
            ${isBookmarked ? '★ Đã lưu' : '☆ Lưu thớt'}
          </button>
        </div>
        <div style="font-size:0.85rem;color:var(--text-muted);">
          Trang ${t.page} / ${t.maxPage}
        </div>
      </div>

      <h2 style="font-size:1.2rem;margin-bottom:12px;">${t.title}</h2>

      ${state.galleryMode ? `
        <div class="media-grid">
          ${t.allImages.map(src => `<img src="${src}" onclick="openLightbox('${src}')" loading="lazy" />`).join('')
            || '<p>Không có ảnh nào trong trang này.</p>'}
        </div>
      ` : ''}

      <div id="postsList">
        ${visiblePosts.map(p => `
          <div class="post-card">
            <div class="post-header">
              <div>
                <span class="post-author">${p.author}</span>
                ${p.author === t.opAuthor ? '<span class="op-tag">CHỦ THỚT</span>' : ''}
              </div>
              <div>${p.time} • ${p.postNum}</div>
            </div>
            <div class="post-body">${p.html}</div>
          </div>
        `).join('') || '<div class="post-card">Trang này không có bài viết nào của Chủ thớt. Hãy chuyển sang trang tiếp theo!</div>'}
      </div>

      <div class="pagination">
        ${t.page > 1 ? `<button onclick="loadThread('${t.path}', 1)">« Đầu</button>` : ''}
        ${t.page > 1 ? `<button onclick="loadThread('${t.path}', ${t.page - 1})">← Trang ${t.page - 1}</button>` : ''}
        <input type="number" min="1" max="${t.maxPage}" value="${t.page}"
               style="width:65px;text-align:center;" class="search-input"
               onchange="loadThread('${t.path}', parseInt(this.value)||1)" />
        ${t.page < t.maxPage ? `<button onclick="loadThread('${t.path}', ${t.page + 1})">Trang ${t.page + 1} →</button>` : ''}
        ${t.page < t.maxPage ? `<button onclick="loadThread('${t.path}', ${t.maxPage})">Cuối »</button>` : ''}
      </div>
    `;
  }

  function toggleOpOnly() {
    state.opOnlyMode = !state.opOnlyMode;
    renderThreadView();
  }

  function toggleGalleryMode() {
    state.galleryMode = !state.galleryMode;
    renderThreadView();
  }

  function toggleBookmark(path) {
    const idx = state.bookmarks.findIndex(b => b.path === path);
    if (idx >= 0) {
      state.bookmarks.splice(idx, 1);
    } else if (state.currentThread) {
      state.bookmarks.unshift({
        path,
        title: state.currentThread.title,
        page: state.currentThread.page
      });
    }
    localStorage.setItem('xr_bookmarks', JSON.stringify(state.bookmarks));
    renderThreadView();
  }

  function toggleBookmarksView() {
    const main = document.getElementById('appMain');
    main.innerHTML = `
      <h3 style="margin-bottom:12px;">🔖 Thớt đã đánh dấu & Đọc gần đây</h3>
      ${state.bookmarks.map(b => `
        <div class="thread-item" onclick="loadThread('${b.path}', ${b.page || 1})">
          <div class="thread-title">${b.title}</div>
          <div class="thread-meta"><span>Đã lưu tại trang ${b.page || 1}</span></div>
        </div>
      `).join('') || '<div class="post-card">Chưa có thớt nào được lưu.</div>'}
    `;
  }

  // Quản lý Modal Chuyên mục (Forums)
  function openForumsModal() {
    renderForumsModalList();
    document.getElementById('forumsModal').classList.add('open');
  }

  function renderForumsModalList() {
    const container = document.getElementById('allForumsList');
    container.innerHTML = state.forums.map((f, i) => `
      <div class="forum-card">
        <span onclick="document.getElementById('forumsModal').classList.remove('open');loadForum('${f.path}')" style="flex:1;">
          ${f.title}
        </span>
        <button onclick="togglePinForum(${i})" class="${f.pinned ? 'active' : ''}" title="Ghim lên thanh ngang">
          📌
        </button>
      </div>
    `).join('');
  }

  function togglePinForum(index) {
    state.forums[index].pinned = !state.forums[index].pinned;
    localStorage.setItem('xr_forums', JSON.stringify(state.forums));
    renderPinnedForums();
    renderForumsModalList();
  }

  // Cài đặt & Lightbox
  function openSettingsModal() {
    document.getElementById('themeSelect').value = state.settings.theme;
    document.getElementById('fontSizeRange').value = state.settings.fontSize;
    document.getElementById('domainInput').value = state.settings.domain || '';
    document.getElementById('muteInput').value = state.settings.muteKeywords || '';
    document.getElementById('infiniteScrollToggle').checked = !!state.settings.infiniteScroll;
    document.getElementById('settingsModal').classList.add('open');
  }

  function updateSetting(key, val) {
    state.settings[key] = val;
    applySettings();
  }

  function saveSettings() {
    state.settings.domain = document.getElementById('domainInput').value.trim();
    state.settings.muteKeywords = document.getElementById('muteInput').value.trim();
    localStorage.setItem('xr_settings', JSON.stringify(state.settings));
    document.getElementById('settingsModal').classList.remove('open');
    loadForum(state.currentForumPath);
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxModal').classList.add('open');
  }

  // Phím tắt chuyển trang nhanh bằng phím mũi tên ← / →
  window.addEventListener('keydown', e => {
    if (!state.currentThread || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' && state.currentThread.page < state.currentThread.maxPage) {
      loadThread(state.currentThread.path, state.currentThread.page + 1);
    } else if (e.key === 'ArrowLeft' && state.currentThread.page > 1) {
      loadThread(state.currentThread.path, state.currentThread.page - 1);
    }
  });

  // Khởi chạy ứng dụng
  applySettings();
  renderPinnedForums();
  loadForum(state.currentForumPath);
</script>
</body>
</html>
